services:
  postgres:
    image: postgres:16
    container_name: news_agents_postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: newsagent123
      POSTGRES_DB: news_agents
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
